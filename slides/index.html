<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D in the browser · slides</title>
  <link rel="icon" href="../assets/brand/mercator-mark-192.png">
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    /* ---- One slide fills the window ---- */
    body { overflow: hidden; }

    main {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6vh 8vw 10vh;
      font-size: clamp(16px, 2.4vw, 34px);
      line-height: 1.4;
    }
    main h1 { font-size: 2.2em; margin: 0 0 0.3em; line-height: 1.1; }
    main h2 { font-size: 1.6em; margin: 0 0 0.6em; line-height: 1.15; }
    main h1::after, main h2::after {
      content: "";
      display: block;
      width: 3em;
      height: 0.18em;
      margin-top: 0.3em;
      border-radius: 0.1em;
      background: var(--gradient);
    }
    main ul, main ol { margin: 0.2em 0; padding-left: 1.2em; }
    main li { margin: 0.3em 0; }
    main p { margin: 0.4em 0; }
    main strong { color: var(--blue); }
    main a { color: var(--blue); }
    main code { font-size: 0.85em; background: #e9ecf4; padding: 0.05em 0.3em; border-radius: 0.2em; }
    main pre { background: var(--navy); color: white; padding: 0.8em 1em; border-radius: 0.4em; font-size: 0.7em; overflow: auto; }
    main pre code { background: none; padding: 0; color: inherit; }
    main table { border-collapse: collapse; font-size: 0.8em; }
    main th, main td { text-align: left; padding: 0.3em 0.8em 0.3em 0; border-bottom: 1px solid #d5d9e2; }
    main blockquote { margin: 0.5em 0; padding-left: 1em; border-left: 0.2em solid var(--cyan); color: var(--grey); }
    main img { max-width: 100%; max-height: 50vh; }

    /* a title slide: <!-- class: title --> */
    main.title { text-align: left; }
    main.title h1 { font-size: 3em; }

    /* a slide with a live workbook: <!-- class: demo --> */
    main.demo { justify-content: flex-start; padding-top: 4vh; padding-bottom: 7vh; }
    main.demo h2 { font-size: 1.2em; margin-bottom: 0.4em; }

    /* a live workbook on the slide: <iframe class="demo" src="../01-atlas/"></iframe> */
    main iframe.demo {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 0;
      border-radius: 0.5em;
      box-shadow: 0 4px 24px rgba(31, 42, 68, 0.15);
      background: var(--paper);
    }

    /* ---- Speaker notes (press N) ---- */
    aside {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 40vh;
      overflow: auto;
      padding: 16px 8vw 40px;
      font-size: 18px;
      line-height: 1.5;
      color: white;
      background: rgba(31, 42, 68, 0.95);
    }

    /* ---- Progress bar and slide number ---- */
    .progress { position: fixed; left: 0; bottom: 0; height: 5px; background: var(--gradient); transition: width 0.3s; }
    .number { position: fixed; right: 24px; bottom: 16px; font-size: 14px; color: var(--grey); }
    .help { position: fixed; left: 24px; bottom: 16px; font-size: 14px; color: var(--grey); }
  </style>
</head>
<body>
  <main></main>
  <aside hidden></aside>
  <div class="progress"></div>
  <div class="number"></div>
  <div class="help">← → to move · N notes · F full screen</div>

  <script type="module">
    import { marked } from '../vendor/marked/marked.esm.js';

    // A tiny slide viewer:
    //   order.txt lists the slide files, one per line, in the order they're shown
    //   each slide is a Markdown file; anything after a line of ??? is speaker notes
    //   a first line of <!-- class: title --> gives the slide a special layout

    const main = document.querySelector('main');
    const notes = document.querySelector('aside');

    const order = await (await fetch('order.txt')).text();
    const files = order.split('\n').map((line) => line.trim()).filter((line) => line && !line.startsWith('#'));
    const slides = await Promise.all(files.map(async (file) => {
      const text = await (await fetch(file)).text();
      const [body, speakerNotes = ''] = text.split(/^\?\?\?$/m);
      const layout = body.match(/<!--\s*class:\s*([\w-]+)\s*-->/)?.[1] ?? '';
      return { file, layout, html: marked.parse(body), notes: marked.parse(speakerNotes) };
    }));

    let current = 0;

    function show(index) {
      current = Math.max(0, Math.min(slides.length - 1, index));
      const slide = slides[current];
      main.className = slide.layout;
      main.innerHTML = slide.html;
      notes.innerHTML = slide.notes || '<p>(no notes)</p>';
      document.querySelector('.number').textContent = `${current + 1} / ${slides.length}`;
      document.querySelector('.progress').style.width = `${((current + 1) / slides.length) * 100}%`;
      history.replaceState(null, '', `#${current + 1}`); // reloading keeps your place
    }

    // ---- Moving around: keys, and swipes on a phone ----

    addEventListener('keydown', (event) => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) show(current + 1);
      else if (['ArrowLeft', 'PageUp'].includes(event.key)) show(current - 1);
      else if (event.key === 'Home') show(0);
      else if (event.key === 'End') show(slides.length - 1);
      else if (event.key === 'n') notes.hidden = !notes.hidden;
      else if (event.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.body.requestFullscreen();
      else return;
      event.preventDefault();
    });

    let touchStart = null;
    addEventListener('touchstart', (event) => { touchStart = event.touches[0].clientX; });
    addEventListener('touchend', (event) => {
      const distance = event.changedTouches[0].clientX - touchStart;
      if (Math.abs(distance) > 60) show(current + (distance < 0 ? 1 : -1));
    });

    show(Number(location.hash.slice(1)) - 1 || 0);
  </script>
</body>
</html>
